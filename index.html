<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>idnotes</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  line-height: 1.65; color: #1a1a1a; background: #f6f7f9; }
.wrap { max-width: 44rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
header.site { margin-bottom: 1.25rem; padding-bottom: 0.75rem; border-bottom: 1px solid #d8dde6; }
header.site a { color: #1d4ed8; text-decoration: none; font-weight: 600; }
.meta { display: inline-block; margin: 0.35rem 0 1rem; padding: 0.35rem 0.7rem;
  background: #e8f0fe; color: #1e3a8a; border-radius: 6px; font-size: 0.95rem; font-weight: 600; }
article { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 1.25rem 1.35rem 1.75rem; }
h1 { font-size: 1.55rem; margin: 0 0 0.5rem; line-height: 1.3; }
h2 { font-size: 1.2rem; margin: 1.6rem 0 0.6rem; border-bottom: 1px solid #eef2f7; padding-bottom: 0.25rem; }
h3 { font-size: 1.05rem; margin: 1.1rem 0 0.4rem; }
p { margin: 0.55rem 0; }
ul { margin: 0.4rem 0 0.8rem 1.2rem; padding: 0; }
li { margin: 0.25rem 0; }
footer { margin-top: 1.5rem; font-size: 0.85rem; color: #64748b; }
.card { background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:1rem 1.15rem; margin-top:0.75rem; }
.card h2 { margin:0 0 0.35rem; border:0; font-size:1.15rem; }
.card a { color:#1d4ed8; text-decoration:none; }
.search-wrap { position: relative; margin: 1rem 0 0.25rem; }
#q { width: 100%; padding: 0.7rem 0.85rem; font-size: 1rem; border: 1px solid #cbd5e1;
  border-radius: 8px; outline: none; }
#q:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
#suggest { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20;
  background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 8px 24px rgba(15,23,42,.08);
  max-height: 280px; overflow: auto; display: none; }
#suggest button { display: block; width: 100%; text-align: left; border: 0; background: transparent;
  padding: 0.65rem 0.85rem; cursor: pointer; font: inherit; color: inherit; border-bottom: 1px solid #f1f5f9; }
#suggest button:last-child { border-bottom: 0; }
#suggest button:hover, #suggest button[aria-selected="true"] { background: #eff6ff; }
#suggest .title { font-weight: 600; }
#suggest .hint { display:block; font-size: 0.85rem; color: #64748b; margin-top: 0.15rem; }
#list .card.hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
<header class="site">
  <h1 style="margin:0;font-size:1.4rem">idnotes</h1>
  <p style="margin:0.4rem 0 0;color:#64748b;font-size:0.95rem">感染科讀書筆記靜態鏡像（院內可連 GitHub Pages）</p>
</header>
<div class="search-wrap">
  <label for="q" class="visually-hidden" style="position:absolute;left:-9999px">搜尋筆記</label>
  <input id="q" type="search" placeholder="搜尋標題、關鍵字…" autocomplete="off" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false"/>
  <div id="suggest" role="listbox" aria-label="搜尋建議"></div>
</div>
<div id="list"></div>
<footer>Repo: <a href="https://github.com/idnerdtw/idnotes">idnerdtw/idnotes</a></footer>
</div>
<script>
{% raw %}
const NOTES = [{"id": "lung-tx-influenza-a", "title": "肺移植 A 型流感治療", "updated": "2026-09-17", "takeaway": "可靠 PO/NG 以腎調 oseltamivir 為首選；抗生素依肺炎／重症／共感染個別化。", "keywords": ["肺移植", "流感", "influenza", "oseltamivir", "peramivir", "baloxavir", "zanamivir", "抗生素", "transplant", "LTx", "TAMIFLU", "AST", "CDC", "IDSA"], "url": "notes/lung-tx-influenza-a.html"}];
const listEl = document.getElementById('list');
const qEl = document.getElementById('q');
const sugEl = document.getElementById('suggest');
let active = -1;

function norm(s) {
  return (s || '').toLowerCase().normalize('NFKC');
}

function matches(note, q) {
  if (!q) return true;
  const hay = norm([note.title, note.takeaway, ...(note.keywords||[])].join(' '));
  return q.split(/\s+/).filter(Boolean).every(t => hay.includes(norm(t)));
}

function renderList(q) {
  listEl.innerHTML = '';
  const hits = NOTES.filter(n => matches(n, q));
  if (!hits.length) {
    listEl.innerHTML = '<p style="color:#64748b">沒有符合的筆記。</p>';
    return;
  }
  for (const n of hits) {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `<h2><a href="${n.url}">${n.title}</a></h2>
      <p class="meta">更新日期：${n.updated}（Asia/Taipei）</p>
      <p style="margin:0;color:#475569;font-size:0.95rem">${n.takeaway}</p>`;
    listEl.appendChild(div);
  }
}

function renderSuggest(q) {
  sugEl.innerHTML = '';
  active = -1;
  if (!q) {
    sugEl.style.display = 'none';
    qEl.setAttribute('aria-expanded', 'false');
    return;
  }
  const hits = NOTES.filter(n => matches(n, q)).slice(0, 8);
  if (!hits.length) {
    sugEl.style.display = 'none';
    qEl.setAttribute('aria-expanded', 'false');
    return;
  }
  hits.forEach((n, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.setAttribute('role', 'option');
    btn.setAttribute('aria-selected', 'false');
    btn.innerHTML = `<span class="title">${n.title}</span><span class="hint">${n.takeaway}</span>`;
    btn.addEventListener('mousedown', (e) => {
      e.preventDefault();
      location.href = n.url;
    });
    sugEl.appendChild(btn);
  });
  sugEl.style.display = 'block';
  qEl.setAttribute('aria-expanded', 'true');
}

qEl.addEventListener('input', () => {
  const q = qEl.value.trim();
  renderList(q);
  renderSuggest(q);
});

qEl.addEventListener('keydown', (e) => {
  const opts = [...sugEl.querySelectorAll('button')];
  if (!opts.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    active = (active + 1) % opts.length;
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    active = (active - 1 + opts.length) % opts.length;
  } else if (e.key === 'Enter' && active >= 0) {
    e.preventDefault();
    opts[active].dispatchEvent(new Event('mousedown'));
    return;
  } else if (e.key === 'Escape') {
    sugEl.style.display = 'none';
    qEl.setAttribute('aria-expanded', 'false');
    return;
  } else {
    return;
  }
  opts.forEach((b, i) => b.setAttribute('aria-selected', i === active ? 'true' : 'false'));
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) {
    sugEl.style.display = 'none';
    qEl.setAttribute('aria-expanded', 'false');
  }
});

renderList('');
{% endraw %}
</script>
</body>
</html>
